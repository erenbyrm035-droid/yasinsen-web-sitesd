name: Lead Radarı

# Zamanlanmis lead arastirmasi.
#
# Her sabah calisir: yeni isletmeleri kesfeder, sitelerini denetler, puanlar ve
# "bugun ne degisti" raporunu depoya isler.
#
# Bu is akisi HICBIR isletmeye mesaj gondermez, e-posta atmaz, disari veri
# yazmaz. Yalnizca herkese acik sayfalari okur ve sonucu bu depoya kaydeder.

on:
  schedule:
    # Her gun 06:00 UTC = Turkiye saatiyle 09:00
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Kaç lead işlensin'
        required: false
        default: '100'
      source:
        description: 'Kaynak: places | osm'
        required: false
        default: 'places'

concurrency:
  # Ayni anda iki calistirma olmasin — ikisi de veritabanina yazar.
  group: lead-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      # Raporu depoya islemek icin gerekli.
      contents: write
      # Onceki calistirmanin veritabani artefaktini indirmek icin gerekli.
      actions: read

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      # Onceki calistirmanin veritabanini geri yukle.
      #
      # Bu adim olmadan her calistirma SIFIRDAN basliyordu: lead'ler yeniden
      # kesfediliyor, gecmis skorlar kayboluyordu. Artik ayni dosyada satis
      # verisi de duruyor (gorusme kayitlari, takipler, teklifler) — onu
      # kaybetmek kabul edilemez.
      #
      # Ucuncu parti action yerine runner'da hazir gelen `gh` kullaniliyor:
      # tedarik zincirine yeni bagimlilik eklemiyoruz.
      #
      # Artefakt yoksa (ilk calistirma ya da 14 gunluk saklama suresi dolmus)
      # is akisi yine calisir, sadece bos veritabaniyla baslar.
      - name: Önceki veritabanını geri yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          last_run="$(gh run list \
            --workflow lead-radar.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId' 2>/dev/null || true)"

          if [ -z "$last_run" ] || [ "$last_run" = "null" ]; then
            echo "Önceki başarılı çalıştırma yok — sıfırdan başlanıyor."
          else
            echo "Son başarılı çalıştırma: $last_run"
            gh run download "$last_run" --dir data-restore 2>/dev/null || \
              echo "Artefakt indirilemedi (süresi dolmuş olabilir)."
          fi

          found="$(find data-restore -name 'viva.db' -print -quit 2>/dev/null || true)"
          if [ -n "$found" ]; then
            cp "$found" data/viva.db
            echo "Veritabanı geri yüklendi ($(du -h data/viva.db | cut -f1))."
          else
            echo "Geri yüklenecek veritabanı bulunamadı."
          fi

      # Calistirma oncesi satis verisi sayilir; sonrasinda azalirsa is durur.
      - name: Satış verisini say
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('data/viva.db')) { console.log('CALLS_BEFORE=0'); process.exit(0); }
            const D = require('better-sqlite3');
            const db = new D('data/viva.db', { readonly: true });
            const n = (q) => { try { return db.prepare(q).get().n; } catch { return 0; } };
            const calls = n('SELECT COUNT(*) n FROM call_logs');
            const offers = n('SELECT COUNT(*) n FROM offers');
            console.log('Mevcut — lead:', n('SELECT COUNT(*) n FROM leads'),
                        '| görüşme:', calls, '| teklif:', offers);
            fs.appendFileSync(process.env.GITHUB_ENV, 'CALLS_BEFORE=' + calls + '\\n');
          "

      - name: Testleri çalıştır
        # Bozuk bir skorlama mantigiyla rapor uretmeyelim.
        run: npm test

      - name: Pipeline
        env:
          # Bu gizli anahtarlar tanimli degilse sistem yine calisir:
          # PageSpeed yerine yerel performans olcumu, Places yerine OSM kullanilir.
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          # Sosyal profil aramasi. Tanimli degilse arama atlanir (bkz. docs/SOCIAL.md).
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
        run: |
          # db:init mevcut tablolari KORUR, yalnizca eksik olanlari ekler.
          npm run db:init
          npm run pipeline -- \
            --limit "${{ github.event.inputs.limit || '100' }}" \
            --city istanbul \
            --source "${{ github.event.inputs.source || 'places' }}" \
            --concurrency 5 \
            --quiet

      # Satis verisinin calistirma sirasinda kaybolmadigini dogrula.
      # Kaybolduysa is akisi burada durur ve artefakt yine de yuklenir.
      # Pipeline satis verisine dokunmamali. Dokunduysa burada yakalanir.
      - name: Satış verisi korundu mu
        run: |
          node -e "
            const D = require('better-sqlite3');
            const db = new D('data/viva.db', { readonly: true });
            const n = (q) => { try { return db.prepare(q).get().n; } catch { return 0; } };
            const calls = n('SELECT COUNT(*) n FROM call_logs');
            console.log('Çalıştırma sonrası görüşme kaydı:', calls);
            const before = Number(process.env.CALLS_BEFORE || 0);
            if (calls < before) {
              console.error('HATA: görüşme kaydı azaldı (' + before + ' -> ' + calls + '). Pipeline satış verisini silmiş.');
              process.exit(1);
            }
          "

      - name: Rapor üret
        run: npm run report

      - name: Raporu depoya işle
        run: |
          git config user.name  "lead-radar[bot]"
          git config user.email "lead-radar[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          git commit -m "Lead radarı raporu: $(date -u +%Y-%m-%d)"
          # Bu sirada dala baska bir push olduysa uzerine yazma — birlestir.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Raporu iş özetine yaz
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Rapor üretilemedi." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Veritabanını artefakt olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viva-db-${{ github.run_number }}
          path: data/viva.db
          retention-days: 14
          if-no-files-found: warn
